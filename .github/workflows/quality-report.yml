name: Quality report

# Ręczny raport jakości algorytmów na zdjęciach testowych (pobieranych tylko na czas przebiegu, nie trafiają do repo).
# Wyniki (arkusze PNG + report.md) trafiają na gałąź quality-report.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Download test photos
        run: |
          mkdir -p "$RUNNER_TEMP/stock"
          base=https://raw.githubusercontent.com
          # name=ścieżka; tylko zdjęcia dobrej jakości (≥ 1000 px), różne światło: chmury i refleksy, pochmurne niebo,
          # portret na tle stadionu, kontrast na ulicy, białe futro, ciemne partie
          for e in boat_clouds=opencv/opencv_extra/4.x/testdata/stitching/boat1.jpg \
                   boat_reflections=opencv/opencv_extra/4.x/testdata/stitching/boat3.jpg \
                   boat_ice=opencv/opencv_extra/4.x/testdata/stitching/boat5.jpg \
                   beach_overcast=tensorflow/models/master/research/object_detection/test_images/image2.jpg \
                   portrait_stadium=ultralytics/yolov5/master/data/images/zidane.jpg \
                   beagles=tensorflow/models/master/research/object_detection/test_images/image1.jpg \
                   white_dog=pytorch/hub/master/images/dog.jpg \
                   street_bus=ultralytics/yolov5/master/data/images/bus.jpg \
                   aloe=opencv/opencv/4.x/samples/data/aloeL.jpg; do
            curl -fsSL -o "$RUNNER_TEMP/stock/${e%%=*}.jpg" "$base/${e#*=}"
          done
          ls -l "$RUNNER_TEMP/stock"
      - name: Run quality test
        continue-on-error: true
        env:
          STOCK_PHOTOS: ${{ runner.temp }}/stock
          QUALITY_OUT: ${{ runner.temp }}/quality
        run: ./gradlew :app:testDebugUnitTest --tests '*StockPhotoQualityTest' --tests '*SliderRegressionTest' -i
      - name: Publish report
        if: always()
        run: |
          git config user.name "Jack4B"
          git config user.email "25393299+Jack4B@users.noreply.github.com"
          git checkout --orphan quality-report
          git rm -rf -q . || true
          cp -r "$RUNNER_TEMP/quality/." . || true
          git add -A
          git commit -m "[Jack4B] Raport jakości algorytmów"
          git push -f origin quality-report
