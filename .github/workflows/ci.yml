name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  ktlint" | sha256sum -c -
          ./ktlint "**/*.kt" "**/*.kts" "!**/build/**"
      - name: detekt
        run: |
          curl -sSL -o detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          echo "2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1  detekt.jar" | sha256sum -c -
          # core/* i app: pełne reguły; feature/*: nakładka z wyjątkami dla @Composable.
          java -jar detekt.jar --input . --excludes "**/build/**,**/feature/**" --config config/detekt/detekt.yml --build-upon-default-config
          java -jar detekt.jar --input feature --excludes "**/build/**" --config config/detekt/detekt.yml,config/detekt/detekt-feature.yml --build-upon-default-config

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check versionCode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(./gradlew -q :app:printVersionCode | grep '^versionCode=' | cut -d= -f2)
          echo "versionCode=$CODE"
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -z "$TAG" ]; then echo "Brak releasów - pomijam"; exit 0; fi
          LAST=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | grep -oE 'versionCode=[0-9]+' | head -1 | cut -d= -f2)
          if [ -z "$LAST" ]; then echo "Release $TAG bez versionCode w opisie - pomijam"; exit 0; fi
          echo "Ostatni release: $LAST"
          if [ "$CODE" -le "$LAST" ]; then echo "::error::versionCode $CODE <= $LAST"; exit 1; fi
      - name: Build and unit tests
        # Roborazzi verify: porównanie z PNG w feature/*/src/test/screenshots.
        run: ./gradlew assembleDebug testDebugUnitTest -Proborazzi.test.verify=true --stacktrace
      - name: Upload Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roborazzi-diffs
          path: '**/build/outputs/roborazzi/'
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retro-film-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  photo-compare:
    # Porównania 144³ vs 33³ na zdjęciach (tools/photocompare.py); obrazy tylko jako artefakt, nie w repo.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python deps
        run: pip install numpy pillow
      - name: Cache HaldCLUT.zip
        id: hald
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: HaldCLUT.zip
          key: haldclut-0ffca81f30c72d7bbb85adab0ed98bbdeb0e1034cd6f5986f9f993bb66999dc2
      - name: Download HaldCLUT.zip (RawTherapee, CC BY-SA 4.0)
        if: steps.hald.outputs.cache-hit != 'true'
        run: curl -sSfL -o HaldCLUT.zip https://rawtherapee.com/shared/HaldCLUT.zip
      - name: Verify HaldCLUT.zip
        run: echo "0ffca81f30c72d7bbb85adab0ed98bbdeb0e1034cd6f5986f9f993bb66999dc2  HaldCLUT.zip" | sha256sum -c -
      - name: Fetch photos (Wikimedia Commons, sha256)
        run: python3 tools/golden/fetch_photos.py --cache "$RUNNER_TEMP/photos-orig"
      - name: Generate comparisons
        run: |
          python3 -c "
          import json, sys, zipfile
          sys.path.insert(0, 'tools')
          from photocompare import FILMS
          cat = {c['id']: c for c in json.load(open('tools/packs/catalog-33-full.json'))['luts']}
          z = zipfile.ZipFile('HaldCLUT.zip')
          for f in FILMS:
              z.extract('HaldCLUT/' + cat[f]['source_hald'], 'hald')
          "
          python3 tools/photocompare.py hald/HaldCLUT tools/packs/catalog-33-full.json tools/golden --out out/photo-compare
          cp tools/golden/compare/photos/README.md out/photo-compare/
          git diff --exit-code tools/golden/compare/photos/stats.json || echo "::warning::stats.json różni się od wersji w repo"
          diff <(cut -c1-64 tools/golden/compare/photos/SHA256SUMS) <(cut -c1-64 out/photo-compare/SHA256SUMS) || echo "::warning::sumy JPEG różnią się od SHA256SUMS w repo (inna wersja libjpeg/Pillow?)"
          du -sh out/photo-compare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photo-compare
          path: out/photo-compare/
          retention-days: 14
