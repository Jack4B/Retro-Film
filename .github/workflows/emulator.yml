name: Emulator

# Ręcznie (dowolna gałąź, także main): gh workflow run emulator.yml --ref <gałąź>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Instrumentation tests (P3ExportTest + FilmSwitchPerfTest)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          cores: 2
          disable-animations: true
          script: |
            mkdir -p out/emulator-perf
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace || echo "FAILED" > out/emulator-perf/failed
            adb pull /sdcard/Android/data/app.retrofilm/files/perf/film-switch-perf.json out/emulator-perf/ || true
            adb logcat -d -s FilmSwitchPerf TestRunner AndroidRuntime > out/emulator-perf/logcat.txt || true
            test ! -f out/emulator-perf/failed
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-perf
          path: |
            out/emulator-perf/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
