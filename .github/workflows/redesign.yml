name: Redesign

# Gałąź redesignu: APK debug, testy jednostkowe + Roborazzi (verify) oraz test instrumentalny na emulatorze.
on:
  pull_request:
    branches: [test]
  push:
    branches: [redesign/ui-implementation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build, unit tests, Roborazzi verify
        run: ./gradlew assembleDebug testDebugUnitTest -Proborazzi.test.verify=true --stacktrace
      - name: Upload Roborazzi diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roborazzi-diffs
          path: '**/build/outputs/roborazzi/'
          retention-days: 14
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RetroFilm-redesign-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Instrumented test (RedesignEditorTest)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          cores: 2
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.retrofilm.ui.RedesignEditorTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace
            adb shell am instrument -w -e class app.retrofilm.engine.GlesTilingTest,app.retrofilm.perf.PerfTimingTest,app.retrofilm.perf.SaveStagesTest,app.retrofilm.perf.DngImportTest,app.retrofilm.perf.EncoderTimingTest,app.retrofilm.perf.AutoSuggestTest,app.retrofilm.perf.SaveStressTest app.retrofilm.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/instrument.txt
            adb logcat -d -s RetroPerf:I RetroFilmPerf:I > app/build/perf.txt || true
            grep -q '^OK (' app/build/instrument.txt
      - name: Perf timings
        if: always()
        run: |
          echo '### RetroPerf (emulator, debug)' >> "$GITHUB_STEP_SUMMARY"
          grep -o '[a-z_0-9]*=[0-9]* ms' app/build/perf.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/perf.txt
            app/build/instrument.txt
          retention-days: 14
