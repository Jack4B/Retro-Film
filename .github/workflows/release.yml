name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Require release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Brak sekretu RELEASE_KEYSTORE_BASE64 - release nie może być podpisany kluczem debug."
            exit 1
          fi
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew -q :app:printVersionCode | grep '^versionCode=' > version.txt
      - name: Print signing certificate fingerprint
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          OUT=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK")
          echo "$OUT"
          FP=$(echo "$OUT" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*digest: *//')
          if [ -z "$FP" ]; then echo "::error::Nie znaleziono odcisku SHA-256"; exit 1; fi
          echo "SHA-256 certyfikatu podpisu: $FP"
          echo "### Certyfikat podpisu APK" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            norm() { echo "$1" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }
            if [ "$(norm "$FP")" != "$(norm "$EXPECTED_CERT_SHA256")" ]; then
              echo "::error::Odcisk certyfikatu ($FP) różni się od RELEASE_CERT_SHA256"
              exit 1
            fi
            echo "Odcisk zgodny z RELEASE_CERT_SHA256."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retro-film-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: GitHub Release (tylko dla tagu)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --notes "$(cat version.txt)"
