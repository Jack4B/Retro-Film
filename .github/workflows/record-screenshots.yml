name: Record screenshots

# Ręczne nagranie zrzutów wzorcowych Roborazzi dla wskazanego modułu na bieżącej gałęzi.
# Zmienione PNG trafiają jako commit na tę gałąź (autor Jack4B, bez Co-Authored-By).
on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Moduł Gradle, np. :feature:settings'
        required: true
        default: ':feature:settings'

permissions:
  contents: write

jobs:
  record:
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Record
        env:
          MODULE: ${{ github.event.inputs.module }}
        run: |
          case "$MODULE" in
            :*) ;;
            *) echo "::error::Moduł musi zaczynać się od dwukropka"; exit 1 ;;
          esac
          if ! printf '%s' "$MODULE" | grep -Eq '^(:[A-Za-z0-9_-]+)+$'; then
            echo "::error::Niepoprawna nazwa modułu"; exit 1
          fi
          ./gradlew "${MODULE}:testDebugUnitTest" -Proborazzi.test.record=true
      - name: Commit changed screenshots
        run: |
          git config user.name "Jack4B"
          git config user.email "25393299+Jack4B@users.noreply.github.com"
          git add -A -- '*/src/test/screenshots/*.png'
          if git diff --cached --quiet; then
            echo "Brak zmian w zrzutach"
          else
            git commit -m "[Jack4B] Zrzuty wzorcowe: ${{ github.event.inputs.module }}"
            git push
          fi
